name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Verify wheel and produce monitoring evidence outside checkout
        run: |
          python -m venv /tmp/drift-wheel
          cd /tmp
          /tmp/drift-wheel/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/drift-wheel/bin/drift-reference \
            --database "$GITHUB_WORKSPACE"/artifacts/reference.db \
            --output "$GITHUB_WORKSPACE"/artifacts/reference-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: drift-control-plane-evidence
          path: artifacts/reference-report.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t model-drift-monitoring:ci .
      - name: Verify persistent-volume permissions and health
        run: |
          docker run -d --name drift-ci -p 8000:8000 model-drift-monitoring:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs drift-ci
          exit 1
