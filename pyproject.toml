[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-drift-monitoring"
version = "0.3.0"
description = "Versioned drift, delayed-label performance and alert lifecycle control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
drift-reference = "monitoring.demo:main"

[tool.setuptools]
py-modules = ["drift"]
packages = ["monitoring"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
